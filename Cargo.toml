[package]
name = "gw"
version = "0.2.11"
edition = "2021"
description = "Gradle output filter — strips noise, keeps errors/warnings/status, shows heartbeat"
license = "MIT"

[[bin]]
name = "gw"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
regex = "1"
once_cell = "1"
anyhow = "1"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
ctrlc = "3"
tempfile = "3"

[target.'cfg(unix)'.dependencies]
libc = "0"

[dev-dependencies]

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
