name: Release

on:
  workflow_call:
    inputs:
      tag:
        description: "Tag to release (e.g. v0.1.0)"
        required: true
        type: string
      prerelease:
        description: "Mark as pre-release"
        required: false
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v0.1.0)"
        required: true
      prerelease:
        description: "Mark as pre-release"
        type: boolean
        default: false

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
            archive: tar.gz
          - target: x86_64-apple-darwin
            os: macos-latest
            archive: tar.gz
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            archive: tar.gz
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            cross: true
            archive: tar.gz
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            archive: zip
          - target: aarch64-pc-windows-msvc
            os: windows-latest
            archive: zip
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Install cross-compilation tools
        if: matrix.cross
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"
      - run: cargo build --release --target ${{ matrix.target }} --locked
      - name: Package (tar.gz)
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          NAME="gw-${VERSION}-${{ matrix.target }}"
          mkdir -p "dist/${NAME}"
          cp "target/${{ matrix.target }}/release/gw" "dist/${NAME}/"
          cp README.md LICENSE "dist/${NAME}/" 2>/dev/null || true
          tar -C dist -czf "dist/${NAME}.tar.gz" "${NAME}"
          (cd dist && shasum -a 256 "${NAME}.tar.gz" > "${NAME}.tar.gz.sha256")
        env:
          TAG: ${{ inputs.tag }}
      - name: Package (zip)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $version = "${env:TAG}".TrimStart("v")
          $name = "gw-$version-${{ matrix.target }}"
          New-Item -ItemType Directory -Force -Path "dist/$name" | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/gw.exe" "dist/$name/"
          if (Test-Path "README.md") { Copy-Item "README.md" "dist/$name/" }
          if (Test-Path "LICENSE") { Copy-Item "LICENSE" "dist/$name/" }
          Compress-Archive -Path "dist/$name" -DestinationPath "dist/$name.zip"
          $hash = (Get-FileHash -Algorithm SHA256 "dist/$name.zip").Hash.ToLower()
          "$hash  $name.zip" | Out-File -Encoding ascii "dist/$name.zip.sha256"
        env:
          TAG: ${{ inputs.tag }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.sha256

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Compute combined checksums
        run: (cd dist && sha256sum *.tar.gz *.zip > checksums.txt)
      - name: Upload Release Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.sha256
            dist/checksums.txt
          prerelease: ${{ inputs.prerelease }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  homebrew:
    name: Update Homebrew formula
    needs: release
    if: ${{ !inputs.prerelease }}
    runs-on: ubuntu-latest
    steps:
      - name: Resolve version
        id: version
        run: |
          TAG="${{ inputs.tag }}"
          VERSION="${TAG#v}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Download checksums
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download "${{ steps.version.outputs.tag }}" \
            --repo "${{ github.repository }}" \
            --pattern checksums.txt
      - name: Parse checksums
        id: sha
        run: |
          set -euo pipefail
          v="${{ steps.version.outputs.version }}"
          for arch in aarch64-apple-darwin x86_64-apple-darwin aarch64-unknown-linux-gnu x86_64-unknown-linux-gnu; do
            sum=$(grep "gw-${v}-${arch}.tar.gz" checksums.txt | awk '{print $1}')
            key=$(echo "$arch" | tr -- '-' _)
            echo "${key}=${sum}" >> "$GITHUB_OUTPUT"
          done
      - name: Generate formula
        run: |
          cat > gw.rb <<'FORMULA'
          class Gw < Formula
            desc "Gradle output filter for AI coding agents — strips noise, keeps errors/warnings/status"
            homepage "https://github.com/AndVl1/gw"
            version "VERSION_PLACEHOLDER"
            license "MIT"

            on_macos do
              on_arm do
                url "https://github.com/AndVl1/gw/releases/download/TAG_PLACEHOLDER/gw-VERSION_PLACEHOLDER-aarch64-apple-darwin.tar.gz"
                sha256 "SHA_MAC_ARM_PLACEHOLDER"
              end
              on_intel do
                url "https://github.com/AndVl1/gw/releases/download/TAG_PLACEHOLDER/gw-VERSION_PLACEHOLDER-x86_64-apple-darwin.tar.gz"
                sha256 "SHA_MAC_INTEL_PLACEHOLDER"
              end
            end

            on_linux do
              on_arm do
                url "https://github.com/AndVl1/gw/releases/download/TAG_PLACEHOLDER/gw-VERSION_PLACEHOLDER-aarch64-unknown-linux-gnu.tar.gz"
                sha256 "SHA_LINUX_ARM_PLACEHOLDER"
              end
              on_intel do
                url "https://github.com/AndVl1/gw/releases/download/TAG_PLACEHOLDER/gw-VERSION_PLACEHOLDER-x86_64-unknown-linux-gnu.tar.gz"
                sha256 "SHA_LINUX_INTEL_PLACEHOLDER"
              end
            end

            def install
              bin.install "gw"
            end

            test do
              assert_match "gw", shell_output("#{bin}/gw --version")
            end
          end
          FORMULA
          sed -i "s/VERSION_PLACEHOLDER/${{ steps.version.outputs.version }}/g" gw.rb
          sed -i "s/TAG_PLACEHOLDER/${{ steps.version.outputs.tag }}/g" gw.rb
          sed -i "s/SHA_MAC_ARM_PLACEHOLDER/${{ steps.sha.outputs.aarch64_apple_darwin }}/g" gw.rb
          sed -i "s/SHA_MAC_INTEL_PLACEHOLDER/${{ steps.sha.outputs.x86_64_apple_darwin }}/g" gw.rb
          sed -i "s/SHA_LINUX_ARM_PLACEHOLDER/${{ steps.sha.outputs.aarch64_unknown_linux_gnu }}/g" gw.rb
          sed -i "s/SHA_LINUX_INTEL_PLACEHOLDER/${{ steps.sha.outputs.x86_64_unknown_linux_gnu }}/g" gw.rb
      - name: Push to homebrew-tap
        env:
          GH_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          CONTENT=$(base64 -w 0 gw.rb)
          SHA=$(gh api repos/AndVl1/homebrew-tap/contents/Formula/gw.rb --jq '.sha' 2>/dev/null || echo "")
          if [ -n "$SHA" ]; then
            gh api -X PUT repos/AndVl1/homebrew-tap/contents/Formula/gw.rb \
              -f message="gw ${{ steps.version.outputs.version }}" \
              -f content="$CONTENT" \
              -f sha="$SHA"
          else
            gh api -X PUT repos/AndVl1/homebrew-tap/contents/Formula/gw.rb \
              -f message="gw ${{ steps.version.outputs.version }}" \
              -f content="$CONTENT"
          fi

  winget:
    name: Update winget manifest
    needs: release
    if: ${{ !inputs.prerelease }}
    runs-on: windows-latest
    steps:
      - name: Resolve version
        id: version
        shell: bash
        run: |
          TAG="${{ inputs.tag }}"
          echo "value=${TAG#v}" >> "$GITHUB_OUTPUT"
      - name: Submit to winget-pkgs
        # Updates an existing manifest. The first version of `AndVl1.gw`
        # must be bootstrapped via .github/workflows/winget-bootstrap.yml
        # (manual `workflow_dispatch`) — until that PR lands in
        # microsoft/winget-pkgs, this step fails and is allowed to.
        continue-on-error: true
        uses: vedantmgoyal9/winget-releaser@main
        with:
          identifier: AndVl1.gw
          version: ${{ steps.version.outputs.value }}
          installers-regex: '\.zip$'
          token: ${{ secrets.WINGET_GITHUB_TOKEN }}
